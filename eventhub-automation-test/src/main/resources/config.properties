# EventHub Automation Testing Configuration
# Base URL of frontend application
base.url=http://localhost:5173

# Target browser: chrome or edge
browser=chrome

# Run browser in background (headless mode)
headless=false

# Timeouts in seconds
implicit.wait=10
explicit.wait=15

# Delay between test actions in milliseconds (500ms = 0.5s)
step.delay=1000

# Default test account credentials (seeded in database)
admin.email=seed.admin@eventhub.local
admin.password=EventHub@123

organizer.email=vol.organizer1@eventhub.test
organizer.password=EventHub@123

staff.email=vol.staff1@eventhub.test
staff.password=EventHub@123

customer.email=vol.customer1@eventhub.test
customer.password=EventHub@123

locked.customer.email=vol.customer36@eventhub.test
locked.customer.password=EventHub@123

# Additional Seed Accounts from seeddata.sql (with pre-existing bookings and tickets)
seed.customer.email=seed.customer1@eventhub.local
seed.organizer.email=seed.organizer1@eventhub.local
seed.staff.email=seed.staff1@eventhub.local

# Database connection for automated test data rollback / cleanup
db.url=jdbc:postgresql://localhost:5433/eventhub_db
db.username=postgres
db.password=30032004
db.rollback.enabled=true

