spring.application.name=EventhubBackend
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventhub_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

# Cloudinary credentials stay on the backend; images are not stored locally.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Base64-encoded random key (at least 32 bytes). No built-in signing secret.
app.auth.jwt-secret=${JWT_SECRET:}
# Token lifetimes accept duration suffixes, such as 15m and 7d.
app.auth.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
# Local HTTP: false. Use true when deployed over HTTPS.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Controls when the browser sends cookies in cross-site requests.
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

