spring.application.name=EventhubBackend
spring.config.import=optional:file:./application-local.properties

# AI chatbot: the key is server-only. A missing key leaves other features available.
app.ai.api-key=${OPENROUTER_API_KEY:}
# Choose a model in local configuration or OPENROUTER_MODEL; there is no implicit model.
app.ai.model=${OPENROUTER_MODEL:}
app.ai.max-tokens=${OPENROUTER_MAX_TOKENS:1800}
app.ai.temperature=${OPENROUTER_TEMPERATURE:0.3}
# Empty means use the provider's default; true/false sends an explicit override.
app.ai.reasoning-enabled=${OPENROUTER_REASONING_ENABLED:}
app.ai.timeout=${OPENROUTER_TIMEOUT:45s}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventhub_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:liam252004}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

# Cloudinary credentials stay on the backend; images are not stored locally.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:du5pmld46}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:591491888414923}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:GGULQN42s7Y7i0i5YadNawQSnp8}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Base64-encoded random key (at least 32 bytes). No built-in signing secret.
app.auth.jwt-secret=${JWT_SECRET:ZQSokcCEFGo0dhsphTP+MOXQ5bFLJw0ePFhu1Hcr+qc=}
# Token lifetimes accept duration suffixes, such as 15m and 7d.
app.auth.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
# Local HTTP: false. Use true when deployed over HTTPS.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Controls when the browser sends cookies in cross-site requests.
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Customer checkout: hold seats until payment or expiry, then release them automatically.
app.booking.hold-ttl=${BOOKING_HOLD_TTL:5m}
app.booking.expiry-enabled=${BOOKING_EXPIRY_ENABLED:true}
app.booking.expiry-delay=${BOOKING_EXPIRY_DELAY:30s}
app.booking.ipn-grace-period=${BOOKING_IPN_GRACE_PERIOD:120s}

# Payment confirmation email. Set SPRING_MAIL_HOST when enabling delivery.
app.payment-email.enabled=${PAYMENT_EMAIL_ENABLED:true}
app.payment-email.from=${PAYMENT_EMAIL_FROM:lamlun2506@gmail.com}
app.payment-email.frontend-base-url=${PAYMENT_EMAIL_FRONTEND_URL:http://localhost:5173}
spring.mail.port=${SPRING_MAIL_PORT:587}


spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Use credentials issued for your VNPay Sandbox merchant; never commit real secrets.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/customer/payment-result}

# Settlement worker (refunds are synchronous).
app.finance.worker-delay=${FINANCE_WORKER_DELAY:30s}
app.finance.worker-enabled=${FINANCE_WORKER_ENABLED:true}

